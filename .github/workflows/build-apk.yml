name: Build Android APK 📱

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK con Capacitor y Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Obtener código fuente
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci || npm install

      - name: 🏗️ Compilar Frontend React
        env:
          VITE_API_URL: 'http://192.168.100.16:5000'
        run: npm run build

      - name: 🔄 Sincronizar Capacitor Android
        run: npx cap sync android

      - name: 🔑 Dar permisos a Gradlew
        run: chmod +x android/gradlew

      - name: ⚙️ Compilar APK de Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🚀 Subir APK como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Kawaii-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
